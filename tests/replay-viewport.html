<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApiViewer replay viewport fixture</title>
    <link rel="stylesheet" href="../sidepanel.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="replay-view" aria-label="请求重放编辑器">
        <header class="replay-header">
          <button class="icon-button replay-back" type="button" aria-label="返回请求详情">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <div class="replay-title">
            <strong>编辑并重发</strong>
            <code>/api/device/update?id=123&amp;verbose=true</code>
          </div>
          <span class="replay-context-badge">当前页面</span>
        </header>
        <div class="replay-request-line">
          <label class="replay-method-field"><span class="sr-only">请求方法</span><select><option>POST</option></select></label>
          <label class="replay-url-field"><span class="sr-only">请求 URL</span><input value="https://example.test/api/device/update?id=123&amp;verbose=true" /></label>
          <p class="field-error hidden"></p>
        </div>
        <div class="replay-tabs" role="tablist">
          <button type="button" role="tab" aria-selected="true">参数 <span>2</span></button>
          <button type="button" role="tab" aria-selected="false">请求头 <span>3</span></button>
          <button type="button" role="tab" aria-selected="false">请求体</button>
          <button type="button" role="tab" aria-selected="false">响应</button>
        </div>
        <div class="replay-error-summary hidden"></div>
        <div class="replay-editor-panel">
          <section class="editor-section">
            <div class="editor-section-toolbar">
              <div><strong>查询参数</strong><p class="editor-helper">关闭某一行可临时从发送 URL 中移除该参数。</p></div>
            </div>
            <div class="kv-list">
              <div class="kv-row"><input class="kv-enabled" type="checkbox" checked /><input class="kv-input" value="id" /><input class="kv-input" value="123" /><button class="mini-icon-button" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div>
              <div class="kv-row"><input class="kv-enabled" type="checkbox" checked /><input class="kv-input" value="verbose" /><input class="kv-input" value="true" /><button class="mini-icon-button" aria-label="删除"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button></div>
            </div>
            <button class="secondary-button add-row-button" type="button">＋ 添加参数</button>
          </section>
        </div>
        <footer class="replay-action-bar">
          <label class="credentials-switch"><input type="checkbox" checked /><span>使用当前登录态</span></label>
          <span class="action-spacer"></span>
          <button class="action-button" type="button">恢复原始值</button>
          <button class="action-button primary" type="button"><svg viewBox="0 0 24 24"><path d="m22 2-7 20-4-9-9-4Z"/></svg><span>发送请求</span></button>
        </footer>
      </section>
    </main>
  </body>
</html>
