<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ApiViewer selected request viewport fixture</title>
    <link rel="stylesheet" href="../sidepanel.css" />
    <style>
      html, body { overflow: auto; background: #eef2f7; }
      body { display: grid; place-items: start center; padding: 24px; }
      .fixture { width: min(100%, 660px); height: 320px; border: 1px solid var(--border); background: var(--surface); box-shadow: 0 12px 30px rgba(15, 23, 42, .08); }
    </style>
  </head>
  <body>
    <section class="request-detail fixture" aria-label="请求详情">
      <div class="detail-heading has-selection">
        <div class="detail-endpoint">
          <span class="detail-selection-marker" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </span>
          <span class="sr-only">当前选中的请求</span>
          <span class="method-chip get">GET</span>
          <code title="https://www.iotisyun.com/gateway/sys/gptData?_t=1787968653">/gateway/sys/gptData?_t=1787968653</code>
        </div>
        <div class="detail-meta">
          <span class="ok">200 OK</span><span>78 ms</span><span>1.9 KB</span>
        </div>
      </div>
      <div class="detail-tabs" role="tablist" aria-label="详情内容">
        <button type="button" role="tab" aria-selected="true">概览</button>
        <button type="button" role="tab" aria-selected="false">请求头</button>
        <button type="button" role="tab" aria-selected="false">请求</button>
        <button type="button" role="tab" aria-selected="false">响应</button>
      </div>
      <div class="code-wrap">
        <div class="code-panel">
          <div class="code-toolbar"><span class="format">概览 · JSON</span></div>
          <pre id="detailContent">{
  "url": "https://www.iotisyun.com/gateway/sys/gptData?_t=1787968653",
  "method": "GET",
  "status": 200
}</pre>
        </div>
      </div>
    </section>
  </body>
</html>
