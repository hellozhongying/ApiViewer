<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width" /><title>ApiViewer 请求检查</title><link rel="stylesheet" href="store-shot.css" /></head>
  <body>
    <main class="browser">
      <header class="browser-bar"><span class="browser-dots"><i></i><i></i><i></i></span><div class="address">https://example.test/device/list</div></header>
      <div class="browser-body">
        <section class="context">
          <span class="eyebrow">CURRENT TAB · FETCH / XHR</span>
          <h1>不用切出页面，快速看清每一次 API 请求</h1>
          <p>在 Chrome 侧边栏中检查请求与响应、复制 cURL，并从同一个界面编辑后重发。</p>
          <div class="feature-row"><span>请求与响应详情</span><span>JSON 格式化</span><span>一键复制</span></div>
          <div class="privacy-note"><i>✓</i>捕获记录仅在浏览器运行内存中处理</div>
        </section>
        <div class="panel-wrap"><iframe class="panel-frame" src="../../tests/request-list-viewport.html" title="ApiViewer 请求列表"></iframe></div>
      </div>
    </main>
  </body>
</html>
